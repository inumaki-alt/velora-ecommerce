<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f7f6f2"/><text x="90" y="65" font-family="Arial" font-size="26" letter-spacing="5" fill="#24231f">VELORA.</text><text x="90" y="250" font-family="Georgia" font-size="70" fill="#24231f">Make room for</text><text x="90" y="330" font-family="Georgia" font-style="italic" font-size="70" fill="#9b8970">the meaningful.</text><rect x="760" y="120" width="570" height="600" fill="#d8d0c3"/><text x="90" y="410" font-family="Arial" font-size="18" fill="#77756e">Thoughtful pieces for slower mornings, lighter days,</text><text x="90" y="440" font-family="Arial" font-size="18" fill="#77756e">and a life well considered.</text><rect x="90" y="500" width="250" height="55" fill="#24231f"/><text x="115" y="535" font-family="Arial" font-size="12" fill="white">EXPLORE THE COLLECTION</text></svg>